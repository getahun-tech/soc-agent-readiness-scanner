[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent-readiness-scanner"
version = "0.1.0"
description = "Scores log/telemetry sources on the C1-C8 completeness checks and reports automation eligibility."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Betre Yacob Getahun", email = "contact@betregetahun.com" },
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
splunk = [
    "splunk-sdk>=1.7",
]
sentinel = [
    "azure-identity>=1.15",
    "azure-monitor-query>=1.2",
]
elastic = [
    "elasticsearch>=8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
scanner = "scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner = ["templates/*.j2", "profiles/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
